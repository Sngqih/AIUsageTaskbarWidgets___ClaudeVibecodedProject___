name: release

# Builds UsageTray.exe on Windows, smoke-tests it, and publishes a GitHub release.
# Two ways to start it:
#   1. GitHub website: Actions -> release -> "Run workflow", enter e.g. v0.4.0
#   2. Terminal:       git tag v0.4.0 && git push origin v0.4.0
# The tag must match __version__ in usagetray/__init__.py.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release (must match __version__, e.g. v0.4.0)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tag matches the code version
        shell: pwsh
        run: |
          $v = python -c "import usagetray; print(usagetray.__version__)"
          if ("$env:TAG" -ne "v$v") { throw "Tag $env:TAG doesn't match __version__ $v (expected v$v)" }
          Write-Host "Releasing $env:TAG"
      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Test
        run: python -m unittest discover -s tests
      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --onefile --noconsole
          --name UsageTray --icon assets\usagetray.ico
          --hidden-import pystray._win32 main.py
      - name: Smoke-test the exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\UsageTray.exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "UsageTray.exe --smoke-test failed with exit code $($p.ExitCode)" }
          Write-Host "Smoke test passed"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        # --target creates the tag at this commit when started from the website
        run: gh release create "${{ env.TAG }}" dist\UsageTray.exe --target "${{ github.sha }}" --title "UsageTray ${{ env.TAG }}" --notes-file .github\release-notes.md
