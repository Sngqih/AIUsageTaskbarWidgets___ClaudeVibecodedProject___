name: release

# Push a tag like v0.5.0 to build UsageTray.exe on Windows and publish it
# as a GitHub release:  git tag v0.5.0 && git push origin v0.5.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Test
        run: python -m unittest discover -s tests
      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --onefile --noconsole
          --name UsageTray --icon assets\usagetray.ico
          --hidden-import pystray._win32 main.py
      - name: Smoke-test the exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\UsageTray.exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "UsageTray.exe --smoke-test failed with exit code $($p.ExitCode)" }
          Write-Host "Smoke test passed"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist\UsageTray.exe --title "UsageTray ${{ github.ref_name }}" --notes-file .github\release-notes.md
