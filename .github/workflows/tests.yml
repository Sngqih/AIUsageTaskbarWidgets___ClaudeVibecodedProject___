name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        # pystray is only needed by the tray UI, which the tests don't import
        run: python -m pip install "Pillow>=10.0" pyflakes
      - name: Lint
        run: python -m pyflakes usagetray tests main.py probe.py claude_statusline.py install_claude_statusline.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
