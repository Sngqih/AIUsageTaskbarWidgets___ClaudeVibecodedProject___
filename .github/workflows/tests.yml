name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyflakes
      - name: Lint
        run: python -m pyflakes usagetray tests main.py probe.py claude_statusline.py install_claude_statusline.py
        # pystray's Linux backends need a desktop session; the tests that need it are Windows-only
      - name: Unit tests
        run: python -m unittest discover -s tests -v
